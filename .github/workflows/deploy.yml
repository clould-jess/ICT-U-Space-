name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🚀 Deploy Backend to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "Successfully connected to VPS!"
            
            # IMPORTANT: Change this path to exactly where your backend is on the server!
            TARGET_DIR="/root/ICT-U-Space-"
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo "::error::Directory $TARGET_DIR does not exist on the VPS! Please edit deploy.yml and change TARGET_DIR to your actual backend folder (e.g., /var/www/classroom-reservation)"
              exit 1
            fi
            
            cd "$TARGET_DIR"
            
            if [ ! -d ".git" ]; then
              echo "::error::Directory $TARGET_DIR is not a GitHub repository on the server! You must 'git clone' the repo on your server first."
              exit 1
            fi
            
            # Fix git ownership and force a clean pull
            git config --global --add safe.directory "$TARGET_DIR"
            git reset --hard HEAD
            git pull origin main
            
            docker compose up -d --build
            echo "Deployment successful!"
