name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🚀 Deploy Backend to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "Successfully connected to VPS!"
            
            # Navigate to where your project is stored on the server
            cd /root/ICT-U-Space- || exit
            
            # Fix git ownership and force a clean pull to prevent exit code 128
            git config --global --add safe.directory /root/ICT-U-Space-
            git reset --hard HEAD
            git pull origin main
            
            # Restart the Docker containers with the new code
            docker compose up -d --build
            
            echo "Deployment successful!"
